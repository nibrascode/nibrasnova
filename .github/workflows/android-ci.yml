name: Nibras Nova Android CI & Release Builder

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM Unit Tests (Security, URLs, AdBlocker, Crypto, Summarizer)
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Decode upload keystore
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NOVA_KEYSTORE_BASE64" ]; then
            echo "$NOVA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nova-upload.jks"
            echo "NOVA_KEYSTORE_PATH=$RUNNER_TEMP/nova-upload.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: release falls back to debug signing."
          fi

      - name: Assemble Release APK & Play Store AAB
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nova-upload.jks"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nibras-nova-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release Bundle & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nibras-nova-release-outputs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
