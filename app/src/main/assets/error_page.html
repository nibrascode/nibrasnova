<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Unavailable - Nibras Nova</title>
    <style>
        body {
            background-color: #0A0F1D;
            color: #E2E8F0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            margin: 0;
            padding: 24px;
            text-align: center;
        }
        .badge {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #00E5FF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #00E5FF;
            margin-bottom: 20px;
        }
        h1 { font-size: 20px; margin: 0 0 8px 0; color: #FFFFFF; }
        p { font-size: 14px; color: #94A3B8; max-width: 360px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="badge">!</div>
    <h1 id="t">Unable to Reach Website</h1>
    <p id="d">Nibras Nova could not establish a reliable connection to the requested destination.</p>
    <script>
    (function(){var T={
    az:["Sayta qoşulmaq mümkün olmadı","Nibras Nova istənilən ünvana etibarlı bağlantı qura bilmədi. İnterneti yoxlayıb yenidən cəhd edin.","Səhifə açılmır"],
    en:["Unable to Reach Website","Nibras Nova could not establish a reliable connection to the requested destination.","Page Unavailable"],
    tr:["Siteye ulaşılamadı","Nibras Nova istenen adrese güvenilir bir bağlantı kuramadı. İnterneti kontrol edip tekrar deneyin.","Sayfa açılamıyor"],
    ru:["Не удалось открыть сайт","Nibras Nova не смог надёжно подключиться к адресу. Проверьте интернет и попробуйте снова.","Страница недоступна"],
    ar:["تعذّر الوصول إلى الموقع","لم يتمكن Nibras Nova من إنشاء اتصال موثوق بالعنوان المطلوب. تحقّق من الإنترنت وحاول مجددًا.","الصفحة غير متاحة"]};
    var l=(new URLSearchParams(location.search).get('lang')||navigator.language||'en').slice(0,2);if(!T[l])l='en';
    document.getElementById('t').textContent=T[l][0];document.getElementById('d').textContent=T[l][1];document.title=T[l][2]+' - Nibras Nova';
    document.documentElement.lang=l;if(l==='ar')document.documentElement.dir='rtl';})();
    </script>
</body>
</html>
